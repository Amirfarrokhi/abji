<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربه مادر شدن | دکتر [نام]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap');

        :root {
            --primary-soft: #fce4ec;
            --primary-main: #ec407a;
            --primary-dark: #ad1457;
            --accent: #ffd54f;
            --text-main: #4a4a4a;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #fce4ec 100%);
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
            height: 100vh;
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-soft);
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
        }

        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; background: #e1f5fe; }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 3rem;
            box-shadow: 0 20px 50px rgba(236, 64, 122, 0.1);
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            align-items: center;
        }

        .profile-section {
            text-align: center;
        }

        .main-img {
            width: 280px;
            height: 280px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            object-fit: cover;
            animation: morph 8s ease-in-out infinite;
            border: 8px solid white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        @keyframes morph {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            25% { border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%; }
            50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; }
            75% { border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%; }
            100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
        }

        .info-section h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .info-section p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .booking-trigger {
            background: var(--primary-main);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(236, 64, 122, 0.3);
        }

        .booking-trigger:hover {
            transform: scale(1.05);
            background: var(--primary-dark);
        }

        /* Messaging Modal */
        #messenger-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 30px;
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .messenger-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .messenger-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 1rem;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .whatsapp { background-color: #25D366; }
        .telegram { background-color: #0088cc; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

        .messenger-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .close-modal {
            margin-top: 1.5rem;
            display: block;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .glass-card {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 2rem;
            }
            .info-section { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <section class="hero">
        <div class="glass-card">
            <div class="profile-section">
                <img src="https://via.placeholder.com/300" alt="دکتر ماما" class="main-img">
            </div>
            <div class="info-section">
                <h1>همسفر شما در <br> <span style="color: var(--primary-main);">زیباترین سفر زندگی</span></h1>
                <p>من دکتر [نام] هستم. باور دارم که هر زایمان باید یک تجربه آگاهانه، آرام و سرشار از عشق باشد. اینجا فضایی است برای شنیدن دغدغه‌های شما و مراقبت تخصصی از شما و فرزندتان.</p>
                <div class="booking-trigger" onclick="openModal()">درخواست وقت مشاوره ✨</div>
            </div>
        </div>
    </section>

    <div id="messenger-modal">
        <div class="modal-content">
            <h2>از چه طریقی پیام بدید؟</h2>
            <div class="messenger-options">
                <!-- لینک‌ها را با شماره یا آیدی واقعی جایگزین کنید -->
                <a href="https://wa.me/989120000000" target="_blank" class="messenger-btn whatsapp">
                    <span>واتس‌اپ</span>
                </a>
                <a href="https://t.me/username" target="_blank" class="messenger-btn telegram">
                    <span>تلگرام</span>
                </a>
                <a href="https://instagram.com/username" target="_blank" class="messenger-btn instagram">
                    <span>اینستاگرام</span>
                </a>
            </div>
            <span class="close-modal" onclick="closeModal()">انصراف</span>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('messenger-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('messenger-modal').style.display = 'none';
        }
        window.onclick = function(event) {
            if (event.target == document.getElementById('messenger-modal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
